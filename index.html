<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Signing you in…</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #f0fdf4; color: #166534; text-align: center; padding: 24px;
    }
    .spinner { width: 40px; height: 40px; border: 4px solid #bbf7d0; border-top-color: #16a34a;
      border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn { display: inline-block; margin-top: 20px; padding: 14px 28px; background: #16a34a;
      color: #fff; border-radius: 10px; font-weight: 700; font-size: 16px; text-decoration: none; }
    .msg { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .hint { margin-top: 10px; color: #4b5563; font-size: 14px; max-width: 320px; }
  </style>
</head>
<body>
  <div class="spinner" role="status" aria-label="Signing in"></div>
  <div class="msg">Returning you to PumpkinPro…</div>
  <div class="hint">If the app doesn't open automatically, tap the button below.</div>
  <a id="open" class="btn" href="#">Open PumpkinPro</a>

  <script>
    // Mirrors base44/functions/authBridge: hand the Base44 login result to the
    // native app via an Android intent:// URL (Chrome blocks auto custom-scheme
    // redirects, so we also expose a tappable button — a user gesture launches it).
    (function () {
      var PKG = 'com.pumpkinpro.app';
      var p = new URLSearchParams(window.location.search);
      var parts = [];
      var at = p.get('access_token');
      var inu = p.get('is_new_user');
      if (at) parts.push('access_token=' + encodeURIComponent(at));
      if (inu !== null) parts.push('is_new_user=' + encodeURIComponent(inu));
      var query = parts.length ? '?' + parts.join('&') : '';
      var intentUrl = 'intent://auth-callback' + query + '#Intent;scheme=' + PKG + ';package=' + PKG + ';end';

      document.getElementById('open').href = intentUrl;
      setTimeout(function () { try { window.location.href = intentUrl; } catch (e) {} }, 400);
    })();
  </script>
</body>
</html>
